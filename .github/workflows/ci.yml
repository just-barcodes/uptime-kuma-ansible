---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Where we install collection deps + symlink this collection so the playbook
  # can resolve `just_barcodes.uptime_kuma.*` roles by FQCN.
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections

jobs:
  lint:
    name: Lint (yamllint + ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync dev tools
        run: uv sync --frozen

      - name: Install runtime collection deps (pinned)
        run: |
          uv run ansible-galaxy collection install \
            -r requirements.yml \
            -p "$ANSIBLE_COLLECTIONS_PATH"

      - name: Make this collection resolvable by FQCN
        run: |
          mkdir -p "$ANSIBLE_COLLECTIONS_PATH/ansible_collections/just_barcodes"
          ln -s "$GITHUB_WORKSPACE" \
            "$ANSIBLE_COLLECTIONS_PATH/ansible_collections/just_barcodes/uptime_kuma"

      - name: yamllint
        run: uv run yamllint .

      - name: ansible-lint
        run: uv run ansible-lint

  syntax-check:
    name: Syntax + preflight check (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: ["2.19", "2.20"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install ansible-core ${{ matrix.ansible }}
        run: |
          uv venv
          uv pip install "ansible-core~=${{ matrix.ansible }}.0"

      - name: Install runtime collection deps (pinned)
        run: |
          uv run ansible-galaxy collection install \
            -r requirements.yml \
            -p "$ANSIBLE_COLLECTIONS_PATH"

      - name: Make this collection resolvable by FQCN
        run: |
          mkdir -p "$ANSIBLE_COLLECTIONS_PATH/ansible_collections/just_barcodes"
          ln -s "$GITHUB_WORKSPACE" \
            "$ANSIBLE_COLLECTIONS_PATH/ansible_collections/just_barcodes/uptime_kuma"

      - name: ansible-playbook --syntax-check
        run: |
          uv run ansible-playbook --syntax-check \
            -i tests/ci/inventory.yml \
            -e @tests/ci/vars.yml \
            playbooks/deploy.yml

      - name: ansible-playbook --check preflight-check.yml
        run: |
          uv run ansible-playbook --check \
            -i tests/ci/inventory.yml \
            -e @tests/ci/vars.yml \
            tests/ci/preflight-check.yml

  build:
    name: Build + install tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync dev tools
        run: uv sync --frozen

      - name: Build collection tarball
        id: build
        run: |
          uv run ansible-galaxy collection build --force --output-path dist/
          echo "tarball=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Install runtime deps + built tarball into a fresh path
        run: |
          uv run ansible-galaxy collection install \
            -r requirements.yml \
            -p /tmp/installed-collections
          uv run ansible-galaxy collection install \
            "${{ steps.build.outputs.tarball }}" \
            -p /tmp/installed-collections

      - name: Syntax-check the playbook from the *installed* collection
        run: |
          ANSIBLE_COLLECTIONS_PATH=/tmp/installed-collections \
            uv run ansible-playbook --syntax-check \
              -i tests/ci/inventory.yml \
              -e @tests/ci/vars.yml \
              /tmp/installed-collections/ansible_collections/just_barcodes/uptime_kuma/playbooks/deploy.yml

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-tarball
          path: dist/*.tar.gz
