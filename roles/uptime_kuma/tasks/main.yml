---
- name: Assert required variables are set
  ansible.builtin.assert:
    that:
      - uptime_kuma_domain is defined and uptime_kuma_domain | length > 0
      - uptime_kuma_letsencrypt_email is defined and uptime_kuma_letsencrypt_email | length > 0
    fail_msg: >-
      uptime_kuma_domain and uptime_kuma_letsencrypt_email must both be set
      (see roles/uptime_kuma/defaults/main.yml for the full variable list).
  tags:
    - preflight

- name: Install Docker apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Docker apt repo key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    # Defence in depth: HTTPS + pinned fingerprint. Bump when Docker rotates.
    checksum: "sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570"

- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Create compose project directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render docker-compose.yaml
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ uptime_kuma_install_dir }}/docker-compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: uptime_kuma_compose_file

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ uptime_kuma_install_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: uptime_kuma_caddyfile

- name: Pull images
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ uptime_kuma_install_dir }}"
  register: uptime_kuma_compose_pull
  changed_when: "'Downloaded' in uptime_kuma_compose_pull.stdout or 'Pulled' in uptime_kuma_compose_pull.stdout"

- name: Bring stack up
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ uptime_kuma_install_dir }}"
  register: uptime_kuma_compose_up
  changed_when: >-
    'Started' in uptime_kuma_compose_up.stderr
    or 'Created' in uptime_kuma_compose_up.stderr
    or 'Recreated' in uptime_kuma_compose_up.stderr

- name: Restart stack if config files changed
  ansible.builtin.command: docker compose up -d --force-recreate
  args:
    chdir: "{{ uptime_kuma_install_dir }}"
  when: uptime_kuma_compose_file.changed or uptime_kuma_caddyfile.changed
  changed_when: true
