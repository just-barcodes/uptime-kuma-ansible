---
# Required (no default — fail if unset)
# tailscale_authkey: "tskey-auth-..."     # Tailscale pre-auth key (sensitive!)

# Hostname registered on the tailnet. Defaults to Ansible's inventory_hostname.
tailscale_hostname: "{{ inventory_hostname }}"

# ACL tag(s) to advertise. Empty = no --advertise-tags flag (node shows up
# untagged, which lets the user approve it interactively via the admin console).
tailscale_tags: ""

# Debian release to pull the Tailscale apt repo from.
# Defaults to the host's distribution_release (e.g. "bookworm", "trixie").
tailscale_apt_release: "{{ ansible_facts['distribution_release'] }}"

# Flags passed to `tailscale up`.
#   --ssh                   Enable Tailscale SSH (admin-console-approved).
#   --accept-routes=false   Don't pick up subnet routes from other nodes.
#   --accept-dns=false      Don't let MagicDNS override /etc/resolv.conf.
# Override this list wholesale if you want different behaviour.
tailscale_up_flags: >-
  --ssh
  --accept-routes=false
  --accept-dns=false
  {% if tailscale_tags | length > 0 %}--advertise-tags={{ tailscale_tags }}{% endif %}
  --hostname={{ tailscale_hostname }}

# If true, after Tailscale is verified healthy, swap the public SSH UFW rule
# for a tailscale0-interface-only rule. Requires UFW to be installed (typically
# via the `harden` role). Setting this without harden_enabled is nonsensical
# and will fail.
tailscale_lock_ssh_to_tailnet: false

# SSH port used by the lockdown step (matches harden_ssh_port when harden is
# enabled; exposed here separately so tailscale role has no hard dependency
# on the harden role's variables).
tailscale_ssh_port: 22
