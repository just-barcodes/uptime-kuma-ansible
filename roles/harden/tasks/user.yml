---
- name: Ensure deploy group exists
  ansible.builtin.group:
    name: "{{ deploy_user }}"
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Install deploy user authorized key
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    state: present
    key: "{{ lookup('file', harden_deploy_user_pubkey_file) }}"
    exclusive: true

- name: Grant passwordless sudo to deploy user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ deploy_user }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: "visudo -cf %s"
